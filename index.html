<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12306b">
<meta name="description" content="印度之旅手机公网行动手册 · 2026国庆 14天 孟买→德里">
<title>🛕 印度之旅 · 行动手册</title>
<style>
  /* ============ 基础变量 · 印度风配色 ============ */
  :root{
    --saffron: #FF9933;        /* 藏红花橙 */
    --saffron-dark: #E87A00;
    --saffron-soft: #FFE7CC;
    --indigo: #12306b;         /* 靛蓝 */
    --indigo-light: #1e4785;
    --green: #138808;          /* 印度国旗绿（点缀） */
    --cream: #FBF6EC;          /* 暖米底 */
    --cream-2: #F4ECDA;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #7a7465;
    --line: #E8DFCC;
    --shadow: 0 2px 10px rgba(18,48,107,.08);
    --radius: 14px;
    --tabbar-h: 60px;
    --header-h: 0;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ -webkit-text-size-adjust:100%; }

  body{
    font-family:'PingFang SC', -apple-system, 'Microsoft YaHei', sans-serif;
    background:var(--cream);
    color:var(--text);
    line-height:1.55;
    font-size:16px;
    padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 头部 ============ */
  .header{
    background:linear-gradient(135deg, var(--indigo) 0%, var(--indigo-light) 45%, var(--saffron-dark) 130%);
    color:#fff;
    padding:18px 16px 14px;
    padding-top: calc(18px + env(safe-area-inset-top));
  }
  .header-title{
    font-size:20px;
    font-weight:700;
    letter-spacing:.5px;
  }
  .header-sub{
    font-size:12.5px;
    margin-top:4px;
    opacity:.9;
  }
  .tricolor{
    height:4px;
    margin-top:12px;
    border-radius:2px;
    background:linear-gradient(90deg, var(--saffron) 0 33.3%, #fff 33.3% 66.6%, var(--green) 66.6% 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
  }

  /* ============ 顶部 Tabs（城市 + 日期） ============ */
  .tabs-wrap{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    box-shadow:0 4px 8px rgba(18,48,107,.04);
    padding-bottom:8px;
  }
  .tab-scroll{
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding:10px 12px 0;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .tab-scroll::-webkit-scrollbar{ display:none; }

  .pill{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--muted);
    font-size:14px;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .18s ease;
    font-family:inherit;
  }
  .pill:active{ transform:scale(.96); }
  .pill.active{
    background:var(--saffron);
    border-color:var(--saffron);
    color:#fff;
    box-shadow:0 3px 8px rgba(255,153,51,.4);
  }
  .pill .en{ font-size:10.5px; opacity:.75; font-weight:400; }
  .pill.active .en{ opacity:.9; }

  .date-pills{
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding:8px 12px 0;
    border-top:1px dashed var(--line);
    margin-top:6px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .date-pills::-webkit-scrollbar{ display:none; }
  .date-pills:empty{ display:none; border-top:none; margin-top:0; padding:0; }
  .date-pill{
    flex:0 0 auto;
    background:var(--cream-2);
    color:var(--indigo);
    border:1px solid var(--line);
    font-size:13px;
    font-weight:600;
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    transition:all .18s ease;
  }
  .date-pill.active{
    background:var(--indigo);
    border-color:var(--indigo);
    color:#fff;
  }

  /* ============ 内容区 ============ */
  #content{ max-width:640px; margin:0 auto; padding:14px 12px 0; }
  section{ scroll-margin-top:84px; }

  .section-title{
    font-size:16px;
    font-weight:700;
    color:var(--indigo);
    margin:18px 2px 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::after{
    content:"";
    flex:1;
    height:2px;
    background:linear-gradient(90deg, var(--saffron), transparent);
    opacity:.5;
  }
  section:first-child .section-title{ margin-top:6px; }

  /* ============ 当日行程 · 时间轴 ============ */
  .itinerary-meta{
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(120deg, var(--saffron-soft), #fff);
    border:1px solid #FFD9A6;
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    font-size:14px;
  }
  .itinerary-meta .daytag{
    background:var(--saffron);
    color:#fff;
    font-weight:700;
    font-size:12px;
    padding:2px 8px;
    border-radius:6px;
  }
  .itinerary-meta .city{ font-weight:700; color:var(--indigo); }

  .timeline{ position:relative; padding-left:26px; }
  .timeline::before{
    content:"";
    position:absolute;
    left:8px; top:6px; bottom:6px;
    width:2px;
    background:linear-gradient(180deg, var(--saffron), var(--indigo));
    border-radius:1px;
  }
  .tl-item{
    position:relative;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:12px 14px;
    margin-bottom:12px;
    border-left:3px solid var(--saffron);
  }
  .tl-item::before{
    content:"";
    position:absolute;
    left:-24px; top:18px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--saffron);
    border:2px solid #fff;
    box-shadow:0 0 0 2px var(--saffron);
  }
  .tl-head{ display:flex; align-items:baseline; gap:8px; }
  .tl-time{
    color:var(--saffron-dark);
    font-weight:800;
    font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  .tl-activity{ font-weight:600; font-size:15px; }
  .tl-transport{
    margin-top:6px;
    font-size:12.5px;
    color:var(--indigo-light);
    background:var(--cream-2);
    border-radius:8px;
    padding:4px 8px;
    display:inline-block;
  }
  .tl-empty{
    text-align:center;
    color:var(--muted);
    padding:32px 10px;
    font-size:14px;
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }

  /* ============ 卡片（景点 / 酒店） ============ */
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
    margin-bottom:12px;
  }
  .card h3{
    font-size:15.5px;
    color:var(--indigo);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .badge{
    font-size:11px;
    font-weight:700;
    background:var(--saffron-soft);
    color:var(--saffron-dark);
    padding:2px 8px;
    border-radius:6px;
    flex:0 0 auto;
  }
  .kv{ display:flex; gap:8px; font-size:13.5px; margin-top:5px; }
  .kv .k{
    color:var(--muted);
    flex:0 0 64px;
    font-weight:600;
  }
  .kv .v{ flex:1; }
  .kv .v a{ color:var(--indigo-light); text-decoration:none; }
  .food-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .food-chip{
    font-size:12px;
    background:var(--green);
    color:#fff;
    padding:3px 9px;
    border-radius:999px;
  }

  /* ============ 注意事项 ============ */
  .note-item{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:12px 14px;
    margin-bottom:10px;
    border-left:3px solid var(--indigo);
  }
  .note-cat{
    font-weight:700;
    color:var(--saffron-dark);
    font-size:12.5px;
    letter-spacing:.5px;
    margin-bottom:3px;
  }
  .note-text{ font-size:14px; }

  /* ============ 底部固定 Tab 栏 ============ */
  .bottom-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:100;
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:#fff;
    border-top:1px solid var(--line);
    box-shadow:0 -4px 14px rgba(18,48,107,.12);
    display:flex;
    max-width:640px;
    margin:0 auto;
  }
  .bottom-tab{
    flex:1;
    border:none;
    background:none;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    color:var(--muted);
    transition:color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .bottom-tab .bt-icon{ font-size:20px; line-height:1; }
  .bottom-tab .bt-label{ font-size:11.5px; font-weight:600; }
  .bottom-tab.active{ color:var(--saffron-dark); }
  .bottom-tab.active .bt-icon{ transform:translateY(-1px); }
  .bottom-tab.active::before{
    content:"";
    position:absolute;
    top:0; left:25%; right:25%;
    height:3px;
    background:var(--saffron);
    border-radius:0 0 3px 3px;
  }
  .bottom-tab{ position:relative; }

  /* ============ 桌面宽屏留白 ============ */
  @media (min-width: 700px){
    body{ background:var(--cream-2); }
    /* 顶部与底部栏在宽屏下也居中限宽 */
    .tabs-wrap{ background:var(--cream); }
    .header{ padding-left:24px; padding-right:24px; }
  }
</style>
</head>

    <section id="section-notes">

  <!-- 底部固定三大块 Tab 栏 -->
  <nav id="bottomBar" class="bottom-bar">

    </button>
  </nav>

/* =====================================================================
 * 状态与渲染逻辑
 * ===================================================================== */
const state = {
  cityId: null,
  date: null,
};

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ---- 城市 Tab ---- */
function renderCityTabs() {
  $('#cityTabs').innerHTML = DATA.cities.map((c, i) => {
    const active = c.id === state.cityId ? ' active' : '';
    return `<button class="pill${active}" data-city="${c.id}">${esc(c.name)} <span class="en">${esc(c.en)}</span></button>`;
  }).join('');

  $('#cityTabs').querySelectorAll('.pill').forEach((btn) => {
    btn.addEventListener('click', () => selectCity(btn.dataset.city));
  });
}

/* ---- 日期 Tab（随城市变化） ---- */
function renderDateTabs() {
  const city = DATA.cities.find((c) => c.id === state.cityId);
  const dates = city ? city.dates : [];
  $('#dateTabs').innerHTML = dates.map((d) => {
    const active = d === state.date ? ' active' : '';
    return `<button class="date-pill${active}" data-date="${d}">${d}</button>`;
  }).join('');

  $('#dateTabs').querySelectorAll('.date-pill').forEach((btn) => {
    btn.addEventListener('click', () => selectDate(btn.dataset.date));
  });
}

/* ---- 当日行程时间轴 ---- */
function renderItinerary() {
  const city = DATA.cities.find((c) => c.id === state.cityId);
  const key = `${state.cityId}|${state.date}`;
  const plan = DATA.itinerary[key];

  // 顶部信息条
  $('#itineraryMeta').innerHTML = `
    <span class="daytag">${esc(plan?.dayLabel || '·')}</span>
    <span class="city">${esc(city?.name || '—')}</span>
    <span>· ${esc(state.date || '')}</span>
    ${plan?.note ? `<span style="color:var(--muted)">${esc(plan.note)}</span>` : ''}
  `;

  // 时间轴内容
  if (plan && plan.items && plan.items.length) {
    $('#itinerary').innerHTML = plan.items.map((it) => `
      <div class="tl-item">
        <div class="tl-head">
          <span class="tl-time">${esc(it.time)}</span>
          <span class="tl-activity">${esc(it.activity)}</span>
        </div>
        ${it.transport && it.transport !== '—' ? `<span class="tl-transport">${esc(it.transport)}</span>` : ''}
      </div>
    `).join('');
  } else {
    $('#itinerary').innerHTML = `<div class="tl-empty">该日行程待补充（数据占位）📝</div>`;
  }
}

/* ---- 景点 / 酒店 / 注意事项 渲染（仅一次） ---- */
function renderAttractions() {
  $('#attractions').innerHTML = DATA.attractions.map((s) => `
    <div class="card">
      <h3>🕌 ${esc(s.name)} <span class="badge">${esc(s.city)}</span></h3>
      <div class="kv"><span class="k">门票</span><span class="v">${esc(s.ticket)}</span></div>
      <div class="kv"><span class="k">开放</span><span class="v">${esc(s.hours)}</span></div>
      <div class="kv"><span class="k">交通</span><span class="v">${esc(s.transport)}</span></div>
      <div class="kv"><span class="k">讲解</span><span class="v">${esc(s.intro)}</span></div>
    </div>
  `).join('');
}

function renderHotels() {
  $('#hotels').innerHTML = DATA.hotels.map((h) => `
    <div class="card">
      <h3>🛏️ ${esc(h.name)} <span class="badge">${esc(h.city)}</span></h3>
      <div class="kv"><span class="k">地址</span><span class="v">${esc(h.address)}</span></div>
      <div class="kv"><span class="k">电话</span><span class="v"><a href="tel:${esc(h.phone).replace(/\s/g,'')}">${esc(h.phone)}</a></span></div>
      <div class="kv"><span class="k">预订码</span><span class="v">${esc(h.bookingCode)}</span></div>
      <div class="kv"><span class="k">美食</span><span class="v"></span></div>
      <div class="food-chips">${(h.nearbyFood||[]).map((f)=>`<span class="food-chip">🍽️ ${esc(f)}</span>`).join('')}</div>
    </div>
  `).join('');
}

function renderNotes() {
  $('#notes').innerHTML = DATA.notes.map((n) => `
    <div class="note-item">
      <div class="note-cat">${esc(n.category)}</div>
      <div class="note-text">${esc(n.text)}</div>
    </div>
  `).join('');
}

/* ---- 交互：选择城市 / 日期 ---- */
function selectCity(id) {
  const city = DATA.cities.find((c) => c.id === id);
  if (!city) return;
  state.cityId = id;
  state.date = city.dates[0];   // 默认选中该城市第一天
  renderCityTabs();
  renderDateTabs();
  renderItinerary();
}

function selectDate(d) {
  state.date = d;
  renderDateTabs();
  renderItinerary();
}

/* ---- 底部固定 Tab：滚动定位 + 高亮（scrollspy） ---- */
function initBottomBar() {
  const tabs = [...document.querySelectorAll('.bottom-tab')];
  const sections = tabs.map((t) => document.getElementById(t.dataset.target));

  function setActive(targetId) {
    tabs.forEach((t) => t.classList.toggle('active', t.dataset.target === targetId));
  }

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      const sec = document.getElementById(tab.dataset.target);
      if (sec) {
        setActive(tab.dataset.target);
        sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  // scrollspy：滚动时自动同步高亮
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) setActive(e.target.id);
      });
    }, { rootMargin: '-40% 0px -55% 0px' });
    sections.forEach((s) => s && io.observe(s));
  }
}

/* ---- 初始化 ---- */
function init() {
  renderCityTabs();
  renderAttractions();
  renderHotels();
  renderNotes();
  initBottomBar();
  // 默认选中第一座城市
  if (DATA.cities.length) selectCity(DATA.cities[0].id);
}
init();
</script>
